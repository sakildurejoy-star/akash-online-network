<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akash Online Network — High-Speed Fiber Internet</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Hind+Siliguri:wght@400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #04060d;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-cyan: #00f2fe;
      --primary-blue: #0052cc;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Hind Siliguri', 'Outfit', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* Royal Ambient Background Glow */
    .glow-bg {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1200px;
      height: 600px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(0, 242, 254, 0.06) 40%, transparent 80%);
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }

    /* Top Contact Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--card-border);
      padding: 8px 20px;
    }

    .top-bar-container {
      max-width: 1150px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-contacts {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .top-contacts a {
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .top-contacts a:hover {
      color: var(--primary-cyan);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--accent-green);
      background: rgba(16, 185, 129, 0.1);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px var(--accent-green); }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Header Navigation & Brand Logo */
    .header-nav {
      position: sticky;
      top: 0;
      z-index: 99;
      background: rgba(4, 6, 13, 0.88);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(245, 158, 11, 0.2);
      padding: 14px 20px;
    }

    .header-container {
      max-width: 1150px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1.1;
      background: linear-gradient(135deg, #ffffff 0%, #fef3c7 40%, #f59e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
    }

    .logo-sub {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 3px;
      margin-top: 2px;
    }

    .nav-btn {
      background: linear-gradient(135deg, #0052cc, #002b80);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 82, 204, 0.4);
    }

    .nav-btn:hover {
      background: linear-gradient(135deg, #003db3, #001f5c);
      transform: translateY(-2px);
    }

    /* Hero Section */
    .hero {
      position: relative;
      z-index: 1;
      padding: 60px 20px 40px 20px;
      text-align: center;
      max-width: 950px;
      margin: 0 auto;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 6px 22px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      color: #f59e0b;
      margin-bottom: 25px;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.15);
    }

    /* Royal Title Typography */
    .royal-title-wrap {
      margin-bottom: 20px;
    }

    .royal-heading-main {
      font-family: 'Cinzel', serif;
      font-size: clamp(36px, 6vw, 64px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ffffff 0%, #fef3c7 35%, #f59e0b 70%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px rgba(245, 158, 11, 0.3);
      text-transform: uppercase;
    }

    .royal-heading-sub {
      font-size: clamp(20px, 3.5vw, 28px);
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 1px;
      margin-top: 8px;
    }

    .hero-subtitle {
      font-size: clamp(15px, 2vw, 18px);
      color: var(--text-muted);
      max-width: 700px;
      margin: 0 auto 35px auto;
      line-height: 1.8;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .btn-main {
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #000;
      font-weight: 800;
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(245, 158, 11, 0.5);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: #f59e0b;
      transform: translateY(-3px);
    }

    /* Speed Meter Simulator Box */
    .speedtest-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px 25px;
      max-width: 750px;
      margin: 0 auto 60px auto;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .speed-gauge {
      font-size: 52px;
      font-weight: 800;
      color: #38bdf8;
      margin: 20px 0;
      font-family: 'Outfit', sans-serif;
    }

    .speed-stats {
      display: flex;
      justify-content: space-around;
      gap: 15px;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--card-border);
    }

    .stat-card {
      font-size: 14px;
      color: var(--text-muted);
    }

    .stat-card span {
      display: block;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-top: 4px;
    }

    /* Route Coverage Section */
    .coverage-section {
      max-width: 1100px;
      margin: 0 auto 70px auto;
      padding: 0 20px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
    }

    .section-title p {
      color: var(--text-muted);
      font-size: 15px;
      margin-top: 5px;
    }

    .route-map-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.08) 0%, rgba(4, 6, 13, 0.95) 100%);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 24px;
      padding: 40px 30px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
    }

    .route-header {
      text-align: center;
      margin-bottom: 35px;
    }

    .route-header h3 {
      font-size: 24px;
      color: #f59e0b;
      margin-bottom: 8px;
    }

    .route-header p {
      color: var(--text-muted);
      font-size: 14.5px;
    }

    .route-timeline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      margin: 40px 0;
      flex-wrap: wrap;
      gap: 20px;
    }

    .route-timeline::before {
      content: '';
      position: absolute;
      top: 25px;
      left: 50px;
      right: 50px;
      height: 4px;
      background: linear-gradient(90deg, #f59e0b, #00f2fe, #10b981);
      z-index: 1;
    }

    .route-node {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
      min-width: 110px;
    }

    .node-icon {
      width: 52px;
      height: 52px;
      background: #04060d;
      border: 3px solid #f59e0b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f59e0b;
      font-size: 18px;
      margin-bottom: 12px;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
      transition: all 0.3s ease;
    }

    .route-node:hover .node-icon {
      background: #f59e0b;
      color: #000;
      transform: scale(1.1);
    }

    .node-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
    }

    .node-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .map-container {
      margin-top: 30px;
      width: 100%;
      height: 350px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      overflow: hidden;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Application Form Section */
    .apply-section {
      max-width: 800px;
      margin: 0 auto 60px auto;
      padding: 0 20px;
    }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .form-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .form-title h2 {
      font-size: 26px;
      color: #fff;
    }

    .form-title p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 5px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group label {
      font-size: 14px;
      font-weight: 600;
      color: #f59e0b;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 10px;
      color: #fff;
      font-size: 14.5px;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #f59e0b;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.3);
    }

    .form-control option {
      background: #04060d;
      color: #fff;
    }

    /* Packages Section */
    .packages-section {
      max-width: 1200px;
      margin: 0 auto 70px auto;
      padding: 0 20px;
    }

    .packages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 22px;
    }

    .pkg-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 28px 24px;
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pkg-card:hover {
      border-color: #f59e0b;
      transform: translateY(-6px);
      background: rgba(255, 255, 255, 0.05);
    }

    .pkg-card.featured {
      border-color: #f59e0b;
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.12) 0%, rgba(255, 255, 255, 0.02) 100%);
    }

    .pkg-name {
      font-size: 22px;
      font-weight: 700;
      color: #f59e0b;
      margin-bottom: 6px;
    }

    .pkg-speed {
      font-size: 34px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
    }

    .pkg-price {
      font-size: 22px;
      color: var(--accent-green);
      font-weight: 700;
      margin-bottom: 20px;
      background: rgba(16, 185, 129, 0.1);
      padding: 6px 14px;
      border-radius: 12px;
      display: inline-block;
    }

    .pkg-features {
      list-style: none;
      padding: 0;
      margin-bottom: 22px;
      text-align: left;
    }

    .pkg-features li {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap:
